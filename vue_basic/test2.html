<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue的初体验1和cdn引入</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const app = Vue.createApp({
        template: `<h1>{{message}}</h1>`,
        data:function(){
          return {
            title:"hello world",
            message:'你好呀,vue3'
          }
        }
      });
      app.mount("#app");
    </script>
  </body>
</html>
