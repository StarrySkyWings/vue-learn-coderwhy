<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>v-model绑定checkbok</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <label for="agree"> 
        <input id="agree" type="checkbox" v-model="isAgree"/> 同意协议 
      </label>
      <h2>单选框:{{isAgree}}</h2>

      <div class="hobbies">
        <h2>请选择你的爱好：</h2>
        <label for="sing">
          <input id="sing" type="checkbox" value="sing" v-model="hobbies"> 唱
        </label>
        <label for="jump">
          <input id="jump" type="checkbox" value="jump" v-model="hobbies"> 跳
        </label>
        <label for="rap">
          <input id="rap" type="checkbox" value="rap" v-model="hobbies"> rap
        </label>
        <label for="basketball">
          <input id="basketball" value="basketball" type="checkbox" v-model="hobbies"> 篮球
        </label>
        <h2>爱好:{{hobbies}}</h2>
      </div>
    </div>

    <script>
      // 1.创建app
      const app = Vue.createApp({
        data() {
          return {
            isAgree: false,
            hobbies:[]
          };
        },
      });

      //2.挂载app
      app.mount("#app");
    </script>
  </body>
</html>
