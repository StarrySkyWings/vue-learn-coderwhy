<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>绑定事件的参数传递</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app">
    <h1>{{message}}</h1>
    <button @click="btn1Click">按钮1</button>
    <button @click="btn2Click('tom',18)">按钮2</button>
    <button @click="btn3Click('tom',18,$event)">按钮3</button>
  </div>

  <script>
    // 1.创建app
    const app = Vue.createApp({
      data(){
        return {
          message:'hello world'
        }
      },
      methods:{
        btn1Click(event){
          console.log(event);
          console.log('btn1被点击了')
        },
        btn2Click(name,age){
          console.log('btn2被点击了');
          console.log(name,age)
        },
        btn3Click(name,age,event){
          console.log('btn2被点击了');
          console.log(name,age,event)
        }
      }
    })

    //2.挂载app
    app.mount('#app')
  </script>
</body>
</html>
