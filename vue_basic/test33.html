<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>v-model的值绑定</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- select值绑定 -->
      <select multiple size="3" v-model="fruits">
        <option v-for="item in allFruits" :key="item.value" :value="item.value">
          {{item.text}}
        </option>
      </select>
      <h2>多选:{{fruits}}</h2>
      <hr>
      <!-- checkbox的值绑定 -->
      <h2>请选择你的爱好：</h2>
      <template v-for="item in allHobbies" :key="item.value">
        <label :for="item.value">
          <input :id="item.value" type="checkbox" :value="item.value" v-model="hobbies" /> {{item.text}}
        </label>
      </template>
      <h2>爱好:{{hobbies}}</h2>
    </div>

    <script>
      // 1.创建app
      const app = Vue.createApp({
        data() {
          return {
            // 水果
            allFruits: [
              { value: "apple", text: "苹果" },
              { value: "orange", text: "橘子" },
              { value: "banana", text: "香蕉" },
              { value: "watermallon", text: "西瓜" },
            ],
            fruits: [],
            // 爱好
            allHobbies: [
              { value: "sing", text: "唱" },
              { value: "jump", text: "跳" },
              { value: "rap", text: "rap" },
              { value: "basketball", text: "篮球" },
            ],
            hobbies:[]
          };
        },
      });

      //2.挂载app
      app.mount("#app");
    </script>
  </body>
</html>
