<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue的初体验2</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const app = Vue.createApp({
        template:`
          <h1>电影列表</h1>
          <ul>
            <li v-for="item in movies">{{item}}</li>  
          </ul>  
        `,
        data:function(){
          return {
            message:'你好呀,vue3',
            movies:['大话西游','西游记','红楼梦','水浒传']
          }
        }
      })

      app.mount("#app")
    </script>
  </body>
</html>
